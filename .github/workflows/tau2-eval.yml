name: tau2-eval

on:
  workflow_dispatch:
    inputs:
      task_ids:
        description: "Space-separated banking_knowledge task IDs"
        required: true
        default: "task_001"
      run_label:
        description: "Label for the results directory"
        required: false
        default: ""
      agent:
        description: "Agent: llm_agent (baseline) or llm_agent_harness (improved)"
        required: false
        default: "llm_agent"
      runner:
        description: "Runner: cli (baseline default) or python (in-process run_domain; needed for the harness, or baseline parity checks)"
        required: false
        default: "cli"

# Serialize dispatches so their commit-back pushes never race each other.
concurrency:
  group: tau2-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # commit eval results back to the repo
    env:
      # One label shared by the eval run and the commit-back step.
      SAVE_TO: ${{ inputs.run_label != '' && inputs.run_label || format('gha_{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"  # tau2-bench requires >=3.12,<3.14

      - name: Set up tau2-bench at pin
        run: ./scripts/setup_env.sh

      - name: Offline validation
        working-directory: tau2-bench
        run: uv run python ../scripts/validate_env.py

      - name: Scored eval run
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AGENT: ${{ inputs.agent }}
          RUNNER: ${{ inputs.runner }}
        run: ./scripts/run_eval.sh ${{ inputs.task_ids }}

      - name: Upload results (artifact backup)
        if: always()  # keep even the error results for debugging
        uses: actions/upload-artifact@v4
        with:
          name: tau2-results-${{ github.run_id }}
          path: tau2-bench/data/simulations/
          if-no-files-found: warn

      # tau2 exits 0 even when every task hits an infrastructure error, so the
      # eval step passing is not proof of real data. Gate on the actual rewards.
      - name: Validate results carry signal
        run: python scripts/check_results.py "tau2-bench/data/simulations/${SAVE_TO}/results.json"

      # Only runs when the eval produced valid, scored results (previous step
      # succeeded), so placeholder/error runs never land in the repo.
      - name: Commit results back to repo
        run: |
          set -euo pipefail
          SRC="tau2-bench/data/simulations/${SAVE_TO}"
          mkdir -p "results/${SAVE_TO}"
          cp -R "$SRC"/. "results/${SAVE_TO}/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "results/${SAVE_TO}"
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "eval results: ${SAVE_TO} (run ${{ github.run_id }})"
          # Resilient push: rebase onto any concurrent update and retry.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt ${attempt}"; exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing on latest main..."
            git pull --rebase origin main
          done
          echo "ERROR: could not push results after 5 attempts" >&2
          exit 1
